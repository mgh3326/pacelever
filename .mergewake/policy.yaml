version: 1
enabled: true
required_checks:
  - vet
  - test
  - probe-macos
  - build-linux-amd64
  - build-linux-arm64
  - build-darwin-amd64
  - build-darwin-arm64
blocking:
  - paths: [gate.go, catalog.go, config.go, share.go, exploration.go, outcomes.go, grades.go, reps.go, catalog_snapshot.json, internal/cli/**]
    reason: Admission changes affect running work before a revert can land
  - paths: [.github/workflows/**, .mergewake/**]
    reason: Verification controls require operator review
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50
