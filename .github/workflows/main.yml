# Main stage: every basic check on a push to main, kept under the 10-minute
# target. The race suite, the macOS probe checks, the release build and the
# install smoke are the deploy stage (deploy.yml), which starts only after this
# workflow succeeds for the same sha. The pull-request stage (ci.yml) is
# unchanged and remains the merge condition.
#
# workflow_dispatch exists so the stage can be measured or re-run on any ref;
# the commit status it posts is always `ci-ok`.
name: CI main
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # One group per ref: a newer push to main cancels the older run of that ref.
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      # No -race here: the race suite is the deploy stage's job (deploy.yml).
      - run: go test -count=1 ./...
      - name: test with the clock moved forward
        run: go test -count=1 ./...
        env:
          PACELEVER_TEST_CLOCK_OFFSET: 550d
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go build -trimpath -ldflags='-s -w' -o dist/pacelever-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/pacelever
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/privacy_check.py
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py

  ci-ok:
    name: ci-ok
    needs: [vet, test, build, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post the ci-ok commit status
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A cancelled or skipped job is unknown ("did not run"), not a failed
          # check: keep failure for an actual failure and report cancellation
          # separately, so a newer push cancelling an older run is not red.
          state=success
          for result in $(printf '%s' "$NEEDS" | jq -r '.[].result'); do
            case "$result" in
              success) ;;
              failure) state=failure; break ;;
              *) [ "$state" = failure ] || state=error ;;
            esac
          done
          case "$state" in
            success) description="main stage: vet, test, build, checks" ;;
            failure) description="main stage failed: vet, test, build, checks" ;;
            *) description="main stage cancelled or skipped: vet, test, build, checks" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=ci-ok \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
